<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
<title id="title">Inkling 2 Mini cockpit warning tests on OpenRouter and local hardware</title>
<desc id="desc">Hosted default reasoning returned zero timely readings in 37 checks. Thirteen requests expired, 23 checks occurred while busy, and one capture was missed. No warning was submitted. With reasoning off, the hosted reader missed the critical shield banner and the blank strip stayed quiet. Local IQ4_NL on an RTX 2080 Ti with 11 GiB and an Intel Core i7-10700K timed out at 15 seconds on both matched 1440p frames. There were zero usable local replies, no accuracy score and zero API spend.</desc>
