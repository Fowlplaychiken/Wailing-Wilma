<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Wailing Wilma</title>
  <desc id="desc">Foreground ship display flows into a vision reader, fresh validated readings, and a spoken Wingman warning.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111c2e"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7dd"/>
    </marker>
  </defs>
  <rect width="1000" height="400" rx="24" fill="url(#background)"/>
  <path d="M42 162H958" stroke="#29394e"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <path d="M77 50 107 105H47Z" fill="none" stroke="#ffbe77" stroke-width="3" stroke-linejoin="round"/>
    <path d="M77 68v15m0 8v2" stroke="#ffbe77" stroke-width="4" stroke-linecap="round"/>
    <text x="129" y="82" fill="#f4f7fc" font-size="49" font-weight="700">Wailing Wilma</text>
    <text x="130" y="118" fill="#b6c5d8" font-size="20">Spoken Star Citizen ship warnings for Wingman AI</text>
    <g fill="#162439" stroke="#32495f">
      <rect x="42" y="196" width="269" height="151" rx="14"/>
      <rect x="366" y="196" width="269" height="151" rx="14"/>
      <rect x="689" y="196" width="269" height="151" rx="14"/>
    </g>
    <g stroke="#6ee7dd" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="67" y="220" width="37" height="24" rx="3"/>
      <path d="M85 244v6m-8 0h16M77 232h6l3-4 4 8 3-4h4"/>
      <path d="M394 233l9 9 19-20m7 10v12"/>
      <path d="M717 232h7l10-8v23l-10-8h-7zm23-3c6 5 6 10 0 15m5-21c9 7 9 17 0 24"/>
      <path d="M322 270h32m292 0h32" marker-end="url(#arrow)"/>
    </g>
    <g fill="#f4f7fc" font-size="23" font-weight="700">
      <text x="66" y="284">Read the display</text>
      <text x="391" y="284">Confirm the reading</text>
      <text x="714" y="284">Speak the warning</text>
