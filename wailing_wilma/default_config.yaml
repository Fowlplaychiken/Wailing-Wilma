  required: false
- id: warn_environment
  name: Environment warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_emp
  name: Explicit EMP warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_suit_oxygen
  name: Suit oxygen warnings on foot
  hint: Warn from an explicitly labelled personal suit or helmet oxygen percentage
    on the FPS HUD. Ship life support, ambient O2 and unlabelled icons do not
    establish suit oxygen. Uses the normal fresh-reading confirmations.
  property_type: boolean
  value: false
  required: false
- id: warn_hydration
  name: Hydration warnings on foot
  hint: Warn only from the player's exact hydration LOW or DANGEROUSLY LOW status
    text on the FPS HUD. Recovery text clears the warning. Off by default; does
    not change game controls.
  property_type: boolean
  value: false
  required: false
- id: warn_nutrition
  name: Nutrition warnings on foot
  hint: Warn only from the player's exact nutrition LOW or DANGEROUSLY LOW status
    text on the FPS HUD. Recovery text clears the warning. Off by default; does
    not change game controls.
  property_type: boolean
  value: false
  required: false
- id: warn_blood_loss
  name: Blood loss warnings on foot
  hint: Warn only from the player's exact BLOOD LOSS alert on the FPS HUD. Other players, NPCs, medical instructions and treatment text do not count. Off by default; does not change game controls.
  property_type: boolean
  value: false
  required: false
- id: warn_pressure
  name: High pressure warnings on foot
  hint: Warn only from the player's exact Warning high pressure! alert on the FPS HUD. Other subjects, ship consoles and outside conditions do not count. Off by default; does not change game controls.
  property_type: boolean
  value: false
  required: false
- id: suit_oxygen_low_percent
  name: Suit oxygen low threshold (%)
  hint: Used when suit oxygen warnings are enabled. Must be at least the shared
    critical threshold. Does not change ship oxygen warnings or game controls.
  property_type: number
  value: 20
  required: false
