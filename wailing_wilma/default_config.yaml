module: skills.wailing_wilma.main
name: WailingWilma
api_version: 3
version: 0.1.79
display_name: Wailing Wilma
author: Star Citizen Computer project
description:
  en: Check status and start, stop, or mute optional visual Star Citizen ship warnings for shields, components, power, and engineering.
tags:
- Game
- Star Citizen
- Engineering
discovery_keywords:
- Star Citizen ship warnings
- Wailing Wilma status
- start visual warnings
- stop visual warnings
- mute or unmute warnings
- report a wrong or late Wilma warning
- report a warning Wilma missed
- shield charge warning
- power loss warning
- engineering console
- review a requested engineering adjustment
discoverable_by_default: true
auto_activate: false
custom_properties:
- id: engineering_owner_page
  name: Engineering owner page
  hint: Optional local Star Citizen Computer owner page, such as http://127.0.0.1:8451/computer/.
    Leave out any token. Open the authenticated owner panel first, then use Wilma's review link.
  property_type: string
  value: ''
  required: false
- id: vision_reader
  name: Vision reader
  hint: Use Wingman's configured vision model, or select a separate reader for Wilma.
    An optional local Waterfall bridge can try your configured models in order.
    A direct server can run on another
    Windows or Linux computer; no model or service is installed by this setting.
  property_type: single_select
  options:
  - label: Wingman's configured model
    value: wingman
  - label: OpenRouter
    value: openrouter
  - label: OpenAI-compatible server
    value: local
  - label: Ollama
    value: ollama
  - label: Local Waterfall bridge
    value: waterfall
  value: wingman
  required: false
- id: vision_reader_model
  name: Separate reader model
  hint: Enter the direct reader's model ID, wilma-terminal-ocr for the optional engineering
    terminal reader, or waterfall for the bridge. Your Wingman's conversation model stays selected.
  property_type: string
  value: ''
  required: false
- id: vision_reader_endpoint
  name: Reader server address
  hint: Enter the server's /v1 base URL. Waterfall requires a same-machine loopback
    address. Use HTTPS on untrusted networks; HTTP sends captured images and any selected
    key without encryption. OpenRouter uses its fixed HTTPS address.
  property_type: string
  value: ''
  required: false
- id: vision_reader_secret
  name: Server key name in Secrets (optional)
  hint: Only the existing secret's name, never paste a key here. The bridge requires
    its existing secret name. OpenRouter uses the existing openrouter secret.
  property_type: string
  value: ''
  required: false
- id: vision_reader_json
  name: Request JSON output from the separate reader
  hint: Optional; the selected model/server must support JSON mode. An unsupported request
    is reported without retry or fallback. Wilma still validates every reading;
    valid JSON does not prove that the reading is visible or correct.
  property_type: boolean
  value: false
  required: false
- id: vision_reader_no_reasoning
  name: Disable extra reasoning in the separate reader
  hint: Turn on to ask the reader to skip extra reasoning. Ollama and OpenRouter
    use their own reasoning controls. Other servers need the enable_thinking template
    option. Leave off to use the model's default.
  property_type: boolean
  value: false
  required: false
- id: high_detail_images
  name: High-detail visual readings
  hint: Preserve more small display text for local or API vision providers. Uses up
    to 3.75 megapixels and a 2576-pixel long edge. May increase bandwidth, model
    latency and API cost or exceed your provider's payload limit. Leave off for
    Wingman's stock image encoding. If Ollama reports that a high-detail image exceeds
    its context, Wilma uses stock detail for the next captures with that reader.
  property_type: boolean
  value: false
  required: false
- id: screen_source
  name: Screen source
  hint: Leave on the game. Video playback is a test mode that reads a gameplay video
    playing in a Chrome or Firefox window in front, as a stand-in for a player; it is
    never needed to play.
  property_type: single_select
  options:
  - label: Star Citizen
    value: game
  - label: Video playback (test)
    value: video_playback
  value: game
  required: false
- id: watch_terminals_on_foot
  name: Watch engineering terminals on foot
  hint: When Wingman confirms you are on foot or in EVA, keep this on to read engineering terminals. Turn it off to check only enabled personal warnings. With all personal warnings off, Wilma pauses capture until the seat evidence changes or expires.
  property_type: boolean
  value: true
  required: false
- id: start_enabled
  name: Start Wailing Wilma automatically
  hint: Enable passive visual warnings when this skill is prepared.
  property_type: boolean
  value: false
  required: false
- id: sample_interval_seconds
  name: Minimum time between visual check starts (seconds)
  hint: One check runs at a time. A slow result may already use this interval.
    Missing sources and reader errors wait before trying again.
  property_type: number
  value: 1
  required: false
- id: maximum_reading_age_seconds
  name: Maximum reading age (seconds)
  hint: Discard slower responses rather than speaking old warnings. Prefer a faster
    model over a large value.
  property_type: number
  value: 3
  required: false
- id: critical_percent
  name: Critical remaining percentage
  hint: Shared critical threshold. Each low threshold must be at least this value.
  property_type: number
  value: 5
  required: false
- id: repeat_cooldown_seconds
  name: Repeat warning interval (seconds)
  hint: Wait this long before repeating the same continuing warning. A newly critical
    state can still be announced.
  property_type: number
  value: 60
  required: false
- id: warning_confirmation_frames
  name: Readings needed before a warning
  hint: Number of distinct fresh captures required by the warning policy. Leave at 2 unless a replay comparison supports a different number.
  property_type: number
  value: 2
  required: false
- id: shields_low_percent
  name: Shield charge low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: components_low_percent
  name: Component health low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: hull_low_percent
  name: Hull integrity low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: armor_low_percent
  name: Armor remaining low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: fuel_low_percent
  name: Fuel low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: quantum_fuel_low_percent
  name: Quantum fuel low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: life_support_low_percent
  name: Oxygen low threshold (%)
  hint: Warn when the visible remaining percentage reaches this value. Must be at
    least the critical threshold.
  property_type: number
  value: 20
  required: false
- id: warn_shields
  name: Shield charge warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_components
  name: Component health warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_hull
  name: Hull integrity warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_armor
  name: Armor remaining warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_fuel
  name: Fuel warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_quantum_fuel
  name: Quantum fuel warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
  required: false
- id: warn_life_support
  name: Oxygen warnings
  hint: Enable this warning category. Saved by Wingman; does not change ship controls.
  property_type: boolean
  value: true
